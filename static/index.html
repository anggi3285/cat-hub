<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mimi's Couple Cat Room 🐾💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #151026;
      --card-bg: rgba(30, 24, 52, 0.9);
      --accent: #f472b6;
      --accent-soft: #fbcfe8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --hunger: #fb923c;
      --happy: #ec4899;
      --energy: #38bdf8;
      --clean: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 10%, #2e1e4a 0%, #110d22 100%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }
    .top-header {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand h1 {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: #fed7aa;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .couple-pill {
      background: rgba(244, 114, 182, 0.15);
      border: 1px solid rgba(244, 114, 182, 0.4);
      padding: 6px 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }
    .user-select {
      background: #2a1f42;
      border: 1px solid #6b4d8c;
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
    }

    .main-grid {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 768px) {
      .main-grid {
        grid-template-columns: 1.25fr 0.75fr;
      }
    }

    /* ROOM STAGE */
    .room-stage {
      position: relative;
      width: 100%;
      height: 380px;
      background: linear-gradient(180deg, #1c1533 0%, #281d45 60%, #3e285c 61%, #26163b 100%);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 30px;
    }
    .stage-badge {
      position: absolute;
      top: 14px;
      left: 16px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      color: #fed7aa;
      font-weight: 700;
    }
    .decor-window {
      position: absolute;
      top: 30px;
      right: 30px;
      width: 80px;
      height: 100px;
      border: 4px solid #4d3369;
      border-radius: 8px;
      background: #0f172a;
      overflow: hidden;
    }
    .decor-window::before {
      content: '🌧️';
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 18px;
    }
    .decor-fairy {
      position: absolute;
      top: 14px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      letter-spacing: 12px;
      opacity: 0.85;
    }
    .decor-rug {
      position: absolute;
      bottom: 12px;
      width: 250px;
      height: 50px;
      background: radial-gradient(ellipse at center, #6b21a8 0%, #3b0764 100%);
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.15);
      z-index: 1;
    }
    .cat-avatar {
      position: relative;
      font-size: 85px;
      cursor: pointer;
      z-index: 2;
      user-select: none;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .cat-avatar:hover { transform: scale(1.08); }
    .cat-avatar.sleeping {
      filter: brightness(0.85);
      animation: catZzz 3.5s infinite ease-in-out;
    }
    @keyframes catZzz {
      0%, 100% { transform: translateY(0) scale(0.96); }
      50% { transform: translateY(-4px) scale(1); }
    }
    .bubble-action {
      position: absolute;
      bottom: 95px;
      background: #ffffff;
      color: #1e1b2e;
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 0.82rem;
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s ease;
      z-index: 10;
    }
    .bubble-action.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* STATS CARD */
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .pet-identity {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .pet-name-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pet-level {
      background: #ec4899;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .stage-tag {
      background: rgba(255, 255, 255, 0.1);
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 999px;
      color: #fed7aa;
    }

    /* METER GRID */
    .meter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .meter-item {
      background: rgba(0,0,0,0.25);
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .meter-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .meter-track {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.4s ease;
    }
    .fill-hunger { background: linear-gradient(90deg, #f97316, var(--hunger)); }
    .fill-happy { background: linear-gradient(90deg, #db2777, var(--happy)); }
    .fill-energy { background: linear-gradient(90deg, #0284c7, var(--energy)); }
    .fill-clean { background: linear-gradient(90deg, #059669, var(--clean)); }

    /* ACTION BUTTONS */
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    @media (min-width: 500px) {
      .actions-grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }
    .btn-act {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 10px 6px;
      border-radius: 14px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .btn-act:hover {
      background: rgba(244, 114, 182, 0.2);
      border-color: rgba(244, 114, 182, 0.5);
      transform: translateY(-2px);
    }
    .btn-act.btn-special {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(168, 85, 247, 0.2));
      border-color: rgba(236, 72, 153, 0.5);
    }

    /* RIGHT COLUMN: PROMPT & NOTES */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .prompt-box {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.15), rgba(99, 102, 241, 0.15));
      border: 1px solid rgba(244, 114, 182, 0.3);
      border-radius: 20px;
      padding: 16px;
    }
    .prompt-box h3 {
      font-size: 0.9rem;
      color: #fbcfe8;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .prompt-question {
      font-size: 0.85rem;
      line-height: 1.4;
      margin-bottom: 12px;
      color: #fed7aa;
      font-weight: 600;
    }
    .prompt-answers {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
      max-height: 120px;
      overflow-y: auto;
    }
    .prompt-item {
      background: rgba(0,0,0,0.3);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
    }
    .prompt-item b { color: #f472b6; }
    .prompt-input-row {
      display: flex;
      gap: 6px;
    }
    .prompt-input-row input {
      flex: 1;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      outline: none;
    }
    .prompt-input-row button {
      background: #ec4899;
      border: none;
      color: #fff;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* NOTES DIARY */
    .note-input-row textarea {
      width: 100%;
      height: 55px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 8px 10px;
      color: #fff;
      font-family: inherit;
      font-size: 0.82rem;
      resize: none;
      outline: none;
      margin-bottom: 8px;
    }
    .notes-feed {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      margin-top: 10px;
    }
    .note-card {
      color: #1e1b2e;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .note-author {
      font-weight: 800;
      font-size: 0.72rem;
      margin-bottom: 3px;
      display: flex;
      justify-content: space-between;
    }
    .heart-fx {
      position: fixed;
      font-size: 20px;
      pointer-events: none;
      animation: floatUp 1.2s forwards ease-out;
      z-index: 999;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-70px) scale(1.4); }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="top-header">
    <div class="brand">
      <h1>Mimi's Couple Cat Room 🐾💕</h1>
    </div>
    <div class="couple-pill">
      <span>Mengasuh sebagai:</span>
      <select id="userSelector" class="user-select" onchange="switchUser()">
        <option value="Anggi">Anggi</option>
        <option value="Sayang">Sayang</option>
      </select>
    </div>
  </div>

  <div class="main-grid">
    <!-- LEFT: CAT STAGE & STATS -->
    <div style="display:flex; flex-direction:column; gap:16px;">
      
      <!-- STAGE -->
      <div class="room-stage">
        <div class="stage-badge" id="txtStageTag">🐾 Stage: Kitten</div>
        <div class="decor-fairy" id="decorFairy" style="display:none;">✨ 🏮 ✨ 🏮 ✨ 🏮 ✨</div>
        <div class="decor-window" id="decorWindow" style="display:none;"></div>
        <div class="decor-rug"></div>

        <div class="cat-avatar" id="catAvatar" onclick="handlePetAction('pet', event)">
          <div class="bubble-action" id="bubbleAction">Meow!</div>
          <span id="catEmoji">🐱</span>
        </div>
      </div>

      <!-- STATS & ACTION CONTROLS -->
      <div class="card">
        <div class="pet-identity">
          <div class="pet-name-badge">
            <h2 id="petName" style="font-size:1.15rem; font-weight:800;">Mimi</h2>
            <span class="pet-level" id="petLevel">Lvl 1</span>
            <span class="stage-tag" id="petStage">Kitten</span>
          </div>
          <span style="font-size:0.8rem; color:var(--text-muted);" id="petStatus">Status: Santai</span>
        </div>

        <!-- METERS -->
        <div class="meter-grid">
          <div class="meter-item">
            <div class="meter-label"><span>🍗 Kenyang</span><span id="txtHunger">85%</span></div>
            <div class="meter-track"><div class="meter-fill fill-hunger" id="barHunger" style="width:85%;"></div></div>
          </div>
          <div class="meter-item">
            <div class="meter-label"><span>💖 Bahagia</span><span id="txtHappy">90%</span></div>
            <div class="meter-track"><div class="meter-fill fill-happy" id="barHappy" style="width:90%;"></div></div>
          </div>
          <div class="meter-item">
            <div class="meter-label"><span>⚡ Energi</span><span id="txtEnergy">80%</span></div>
            <div class="meter-track"><div class="meter-fill fill-energy" id="barEnergy" style="width:80%;"></div></div>
          </div>
          <div class="meter-item">
            <div class="meter-label"><span>🧼 Bersih</span><span id="txtClean">80%</span></div>
            <div class="meter-track"><div class="meter-fill fill-clean" id="barClean" style="width:80%;"></div></div>
          </div>
        </div>

        <!-- 6 TAMAGOTCHI ACTIONS -->
        <div class="actions-grid">
          <button class="btn-act" onclick="handlePetAction('feed', event)">
            <span>🐟</span> Makan
          </button>
          <button class="btn-act" onclick="handlePetAction('pet', event)">
            <span>✋</span> Elus
          </button>
          <button class="btn-act" onclick="handlePetAction('bath', event)">
            <span>🛁</span> Mandi
          </button>
          <button class="btn-act" onclick="handlePetAction('play', event)">
            <span>🧶</span> Main
          </button>
          <button class="btn-act" id="btnSleep" onclick="handlePetAction('sleep', event)">
            <span>💤</span> Tidur
          </button>
          <button class="btn-act btn-special" onclick="handlePetAction('hug', event)">
            <span>💌</span> Peluk Kamu
          </button>
        </div>
      </div>

    </div>

    <!-- RIGHT: COUPLE PROMPT & STICKY NOTES -->
    <div class="right-col">
      
      <!-- DAILY COUPLE CHAT PROMPT -->
      <div class="prompt-box">
        <h3><span>💬</span> Obrolan Harian Berdua</h3>
        <div class="prompt-question" id="promptQuestion">Memuat pertanyaan harian...</div>
        <div class="prompt-answers" id="promptAnswers">
          <!-- Answers rendered here -->
        </div>
        <div class="prompt-input-row">
          <input type="text" id="inputPrompt" placeholder="Tulis jawaban manismu...">
          <button onclick="handleSendPrompt()">Kirim</button>
        </div>
      </div>

      <!-- STICKY DIARY -->
      <div class="card">
        <h3 style="font-size:0.9rem; margin-bottom:10px; display:flex; justify-content:space-between;">
          <span>📝 Papan Pesan Kamar</span>
          <span style="font-size:0.75rem; color:var(--text-muted);" id="txtStreak">🔥 1 Hari Bersama</span>
        </h3>
        
        <div class="note-input-row">
          <textarea id="noteInput" placeholder="Tulis pesan manis buat pasangan / Mimi..."></textarea>
          <button style="width:100%; padding:8px; border-radius:10px; background:#f472b6; border:none; color:#fff; font-weight:700; cursor:pointer;" onclick="handleSendNote()">
            Tempel Pesan 💕
          </button>
        </div>

        <div class="notes-feed" id="notesList"></div>
      </div>

    </div>
  </div>

  <script>
    const socket = io();
    const userSelector = document.getElementById('userSelector');
    
    // Auto-load saved user
    const savedUser = localStorage.getItem('cat_user') || 'Anggi';
    userSelector.value = savedUser;

    function switchUser() {
      localStorage.setItem('cat_user', userSelector.value);
    }

    function currentUser() {
      return userSelector.value || 'Anggi';
    }

    function showBubble(msg) {
      const bubble = document.getElementById('bubbleAction');
      bubble.innerText = msg;
      bubble.classList.add('show');
      setTimeout(() => bubble.classList.remove('show'), 3000);
    }

    function spawnHeart(e) {
      const heart = document.createElement('div');
      heart.className = 'heart-fx';
      heart.innerText = ['💖', '🐾', '✨', '🌸', '😻'][Math.floor(Math.random() * 5)];
      
      const x = e ? e.clientX : (window.innerWidth / 2) + (Math.random() * 60 - 30);
      const y = e ? e.clientY : (window.innerHeight / 2);
      heart.style.left = `${x}px`;
      heart.style.top = `${y}px`;
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1200);
    }

    function renderPet(pet) {
      document.getElementById('petName').innerText = pet.name || 'Mimi';
      document.getElementById('petLevel').innerText = `Lvl ${pet.love_level || 1}`;
      document.getElementById('petStage').innerText = pet.stage || 'Kitten';
      document.getElementById('txtStageTag').innerText = `🐾 Stage: ${pet.stage || 'Kitten'}`;
      
      document.getElementById('barHunger').style.width = `${pet.hunger}%`;
      document.getElementById('txtHunger').innerText = `${pet.hunger}%`;

      document.getElementById('barHappy').style.width = `${pet.happiness}%`;
      document.getElementById('txtHappy').innerText = `${pet.happiness}%`;

      document.getElementById('barEnergy').style.width = `${pet.energy}%`;
      document.getElementById('txtEnergy').innerText = `${pet.energy}%`;

      const clean = pet.cleanliness !== undefined ? pet.cleanliness : 80;
      document.getElementById('barClean').style.width = `${clean}%`;
      document.getElementById('txtClean').innerText = `${clean}%`;

      const catEmoji = document.getElementById('catEmoji');
      const catAvatar = document.getElementById('catAvatar');
      const btnSleep = document.getElementById('btnSleep');
      const petStatus = document.getElementById('petStatus');

      if (pet.sleeping) {
        catEmoji.innerText = '😴';
        catAvatar.classList.add('sleeping');
        petStatus.innerText = 'Status: Tidur Nyenyak zzz';
        btnSleep.innerHTML = '<span>☀️</span> Bangun';
      } else {
        catAvatar.classList.remove('sleeping');
        if (pet.status === 'eating') catEmoji.innerText = '😺';
        else if (pet.status === 'purring') catEmoji.innerText = '😻';
        else if (pet.status === 'bath') catEmoji.innerText = '🧼';
        else if (pet.status === 'playing') catEmoji.innerText = '😸';
        else if (pet.status === 'loving') catEmoji.innerText = '🥰';
        else catEmoji.innerText = pet.stage === 'Adult Cat' ? '🐈' : '🐱';

        petStatus.innerText = `Status: ${pet.status || 'Santai'}`;
        btnSleep.innerHTML = '<span>💤</span> Tidur';
      }
    }

    function renderPrompts(prompt, answers) {
      document.getElementById('promptQuestion').innerText = prompt || "Apa kabar kalian hari ini?";
      const container = document.getElementById('promptAnswers');
      container.innerHTML = '';
      if (!answers || Object.keys(answers).length === 0) {
        container.innerHTML = '<div style="font-size:0.75rem; color:var(--text-muted); padding:4px;">Belum ada yang menjawab hari ini~</div>';
        return;
      }
      for (const [author, ans] of Object.entries(answers)) {
        const item = document.createElement('div');
        item.className = 'prompt-item';
        item.innerHTML = `<b>${escapeHtml(author)}:</b> "${escapeHtml(ans)}"`;
        container.appendChild(item);
      }
    }

    function renderNotes(notes) {
      const list = document.getElementById('notesList');
      list.innerHTML = '';
      if (!notes || notes.length === 0) {
        list.innerHTML = '<div style="font-size:0.75rem; color:var(--text-muted); text-align:center; padding:10px;">Belum ada pesan tertempel 🍃</div>';
        return;
      }
      notes.forEach(n => {
        const card = document.createElement('div');
        card.className = 'note-card';
        card.style.background = n.color || '#fef08a';
        card.innerHTML = `
          <div class="note-author">
            <span>${escapeHtml(n.author)}</span>
            <span style="font-weight:400; opacity:0.7;">${n.created_at ? n.created_at.slice(11, 16) : ''}</span>
          </div>
          <div>${escapeHtml(n.content)}</div>
        `;
        list.appendChild(card);
      });
    }

    function escapeHtml(s) {
      return (s || '').replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
    }

    // ACTIONS
    async function loadState() {
      try {
        const res = await fetch('/api/state');
        const data = await res.json();
        renderPet(data.pet);
        renderPrompts(data.prompt, data.prompt_answers);
        renderNotes(data.notes);
        document.getElementById('txtStreak').innerText = `🔥 ${data.total_days} Hari Bersama`;
        if (data.decor && data.decor.fairy_lights) document.getElementById('decorFairy').style.display = 'block';
        if (data.decor && data.decor.window_rain) document.getElementById('decorWindow').style.display = 'block';
      } catch (e) {
        console.error("Load state error:", e);
      }
    }

    async function handlePetAction(action, e) {
      spawnHeart(e);
      const user = currentUser();
      try {
        const res = await fetch('/api/pet/action', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ action, user })
        });
        const data = await res.json();
        if (data.message) showBubble(data.message);
        if (data.pet) renderPet(data.pet);
      } catch (err) {
        console.error(err);
      }
    }

    async function handleSendPrompt() {
      const inp = document.getElementById('inputPrompt');
      const answer = inp.value.trim();
      if (!answer) return;
      const user = currentUser();

      try {
        const res = await fetch('/api/prompt/answer', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ user, answer })
        });
        const data = await res.json();
        if (data.success) {
          inp.value = '';
          renderPrompts(null, data.prompt_answers);
          showBubble(data.message);
          spawnHeart();
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function handleSendNote() {
      const inp = document.getElementById('noteInput');
      const content = inp.value.trim();
      if (!content) return;
      const author = currentUser();

      try {
        const res = await fetch('/api/notes', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ author, content, color: '#fbcfe8' })
        });
        const data = await res.json();
        if (data.success) {
          inp.value = '';
          renderNotes(data.notes);
          showBubble("Pesan cinta tertempel! 💕");
          spawnHeart();
        }
      } catch (e) {
        console.error(e);
      }
    }

    // REAL-TIME SOCKET LISTENERS
    socket.on('pet_updated', payload => {
      renderPet(payload.pet);
      showBubble(payload.message);
      spawnHeart();
    });

    socket.on('prompt_updated', payload => {
      renderPrompts(null, payload.prompt_answers);
      showBubble(payload.message);
      spawnHeart();
    });

    socket.on('notes_updated', notes => {
      renderNotes(notes);
    });

    // Start
    loadState();
  </script>
</body>
</html>
