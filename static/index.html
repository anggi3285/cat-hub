<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mimi's Cozy Cat Room 🐾</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #1e1b2e;
      --card-bg: rgba(30, 27, 46, 0.85);
      --accent: #f472b6;
      --accent-soft: #fbcfe8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --bar-hunger: #fb923c;
      --bar-happy: #ec4899;
      --bar-energy: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #2d2448 0%, #13111c 100%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }
    .header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .title-group h1 {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fed7aa;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .user-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .user-pill input {
      background: transparent;
      border: none;
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      outline: none;
      width: 90px;
    }

    .main-grid {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 768px) {
      .main-grid {
        grid-template-columns: 1.2fr 0.8fr;
      }
    }

    /* ROOM CANVAS / VISUAL */
    .room-stage {
      position: relative;
      width: 100%;
      height: 380px;
      background: linear-gradient(180deg, #1f1b33 0%, #2a2444 65%, #3f2f4c 66%, #281d33 100%);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 30px;
    }

    /* ROOM DECORATIONS */
    .decor-window {
      position: absolute;
      top: 30px;
      left: 30px;
      width: 90px;
      height: 110px;
      border: 4px solid #4a3b61;
      border-radius: 8px;
      background: #0f172a;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(255,255,255,0.05);
    }
    .decor-window::before {
      content: '🌧️';
      position: absolute;
      top: 8px;
      left: 10px;
      font-size: 20px;
      opacity: 0.7;
      animation: floatSlow 4s infinite ease-in-out;
    }
    .decor-fairy {
      position: absolute;
      top: 15px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      padding: 0 40px;
      font-size: 14px;
      filter: drop-shadow(0 0 8px #fef08a);
      animation: twinkle 2s infinite alternate;
    }
    .decor-plant {
      position: absolute;
      bottom: 45px;
      left: 35px;
      font-size: 40px;
      filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
    }
    .decor-radio {
      position: absolute;
      bottom: 50px;
      right: 40px;
      font-size: 34px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .decor-radio:hover { transform: scale(1.1); }
    .decor-rug {
      position: absolute;
      bottom: 15px;
      width: 220px;
      height: 60px;
      background: radial-gradient(ellipse at center, #9d4edd 0%, #5a189a 70%);
      border-radius: 50%;
      opacity: 0.4;
      filter: blur(1px);
    }

    /* CAT VISUAL */
    .cat-avatar {
      position: relative;
      font-size: 80px;
      line-height: 1;
      z-index: 10;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease;
      animation: idleBreathe 3s infinite ease-in-out;
    }
    .cat-avatar:hover { transform: scale(1.08); }
    .cat-avatar.sleeping {
      animation: sleepZzz 4s infinite ease-in-out;
      opacity: 0.9;
    }
    .bubble-action {
      position: absolute;
      top: -35px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
    }
    .bubble-action.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* FLOATING PARTICLES */
    .heart-float {
      position: absolute;
      color: #f472b6;
      font-size: 24px;
      pointer-events: none;
      animation: floatUp 1.2s forwards ease-out;
      z-index: 50;
    }

    /* STATS CARD */
    .stats-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .pet-identity {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .pet-name-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pet-level {
      background: #7c3aed;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 8px;
    }
    .status-text {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* BARS */
    .meter-item {
      margin-bottom: 10px;
    }
    .meter-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-muted);
    }
    .meter-track {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .meter-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.4s ease;
    }
    .fill-hunger { background: linear-gradient(90deg, #ea580c, var(--bar-hunger)); }
    .fill-happy { background: linear-gradient(90deg, #db2777, var(--bar-happy)); }
    .fill-energy { background: linear-gradient(90deg, #0284c7, var(--bar-energy)); }

    /* ACTION BUTTONS */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
    }
    .btn-act {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 12px;
      padding: 10px 4px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-act:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }
    .btn-act:active { transform: translateY(0); }
    .btn-act span { font-size: 1.2rem; }

    /* DIARY & STICKY NOTES */
    .diary-section {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
    }
    .diary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .diary-header h2 {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.1rem;
      color: #fef08a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .note-input-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 10px;
    }
    .note-input-box textarea {
      background: transparent;
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 0.85rem;
      resize: none;
      outline: none;
      height: 48px;
    }
    .note-input-box .bot-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .color-pickers {
      display: flex;
      gap: 6px;
    }
    .dot-color {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.1s;
    }
    .dot-color.active { border-color: #fff; transform: scale(1.15); }
    .btn-send-note {
      background: #ec4899;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      max-height: 280px;
      padding-right: 4px;
    }
    .sticky-card {
      color: #1e1b2e;
      padding: 10px 12px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      position: relative;
      animation: fadeIn 0.3s ease;
    }
    .sticky-author {
      font-size: 0.7rem;
      font-weight: 800;
      opacity: 0.8;
      margin-bottom: 2px;
    }
    .sticky-content {
      font-size: 0.85rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .sticky-time {
      font-size: 0.65rem;
      opacity: 0.6;
      text-align: right;
      margin-top: 4px;
    }

    /* CHECKIN BAR */
    .checkin-banner {
      width: 100%;
      max-width: 900px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
    }
    .streak-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fdba74;
    }

    /* KEYFRAMES */
    @keyframes idleBreathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.02); }
    }
    @keyframes sleepZzz {
      0%, 100% { transform: translateY(2px) scale(0.96); filter: brightness(0.85); }
      50% { transform: translateY(0) scale(0.98); filter: brightness(0.95); }
    }
    @keyframes twinkle {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="title-group">
      <h1>🐾 Mimi's Cozy Room</h1>
    </div>
    <div class="user-pill">
      <span>👤</span>
      <input type="text" id="usernameInput" value="Anggi" placeholder="Nama kamu" />
    </div>
  </div>

  <!-- MAIN TWO COLUMN -->
  <div class="main-grid">
    
    <!-- LEFT: ROOM & STATS -->
    <div style="display: flex; flex-direction: column; gap: 16px;">
      
      <!-- ROOM STAGE -->
      <div class="room-stage" id="roomStage">
        <!-- Decor Items -->
        <div class="decor-fairy" id="decorFairy" style="display:none;">✨ 🏮 ✨ 🏮 ✨ 🏮 ✨</div>
        <div class="decor-window" id="decorWindow" style="display:none;"></div>
        <div class="decor-plant" id="decorPlant">🪴</div>
        <div class="decor-radio" id="decorRadio" title="Lofi Radio">📻</div>
        <div class="decor-rug"></div>

        <!-- THE CAT -->
        <div class="cat-avatar" id="catAvatar" onclick="handlePetAction('pet', event)">
          <div class="bubble-action" id="bubbleAction">Meow!</div>
          🐱
        </div>
      </div>

      <!-- PET STATS & CONTROLS -->
      <div class="stats-card">
        <div class="pet-identity">
          <div class="pet-name-badge">
            <h2 id="petName" style="font-size: 1.1rem; font-weight:700;">Mimi</h2>
            <span class="pet-level" id="petLevel">Lvl 1</span>
          </div>
          <span class="status-text" id="petStatus">Status: Bersantai</span>
        </div>

        <!-- Meters -->
        <div class="meter-item">
          <div class="meter-label">
            <span>🍗 Kenyang (Hunger)</span>
            <span id="txtHunger">85%</span>
          </div>
          <div class="meter-track">
            <div class="meter-fill fill-hunger" id="barHunger" style="width: 85%;"></div>
          </div>
        </div>

        <div class="meter-item">
          <div class="meter-label">
            <span>💖 Senang (Happiness)</span>
            <span id="txtHappy">90%</span>
          </div>
          <div class="meter-track">
            <div class="meter-fill fill-happy" id="barHappy" style="width: 90%;"></div>
          </div>
        </div>

        <div class="meter-item">
          <div class="meter-label">
            <span>⚡ Energi (Energy)</span>
            <span id="txtEnergy">80%</span>
          </div>
          <div class="meter-track">
            <div class="meter-fill fill-energy" id="barEnergy" style="width: 80%;"></div>
          </div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="action-grid">
          <button class="btn-act" onclick="handlePetAction('feed', event)">
            <span>🐟</span> Makan
          </button>
          <button class="btn-act" onclick="handlePetAction('pet', event)">
            <span>✋</span> Elus
          </button>
          <button class="btn-act" id="btnSleep" onclick="handlePetAction('sleep', event)">
            <span>💤</span> Tidur
          </button>
          <button class="btn-act" id="btnCheckin" onclick="handleCheckin()">
            <span>✨</span> Check-in
          </button>
        </div>
      </div>

    </div>

    <!-- RIGHT: DIARY / NOTES -->
    <div class="diary-section">
      <div class="diary-header">
        <h2>📝 Sticky Notes Diary</h2>
      </div>

      <!-- Input Form -->
      <div class="note-input-box">
        <textarea id="noteInput" placeholder="Tinggalkan pesan manis buat kamar..."></textarea>
        <div class="bot-bar">
          <div class="color-pickers">
            <div class="dot-color active" style="background: #fef08a;" onclick="selectColor('#fef08a', this)"></div>
            <div class="dot-color" style="background: #fed7aa;" onclick="selectColor('#fed7aa', this)"></div>
            <div class="dot-color" style="background: #fbcfe8;" onclick="selectColor('#fbcfe8', this)"></div>
            <div class="dot-color" style="background: #bbf7d0;" onclick="selectColor('#bbf7d0', this)"></div>
            <div class="dot-color" style="background: #bae6fd;" onclick="selectColor('#bae6fd', this)"></div>
          </div>
          <button class="btn-send-note" onclick="handleSendNote()">Tempel</button>
        </div>
      </div>

      <!-- Notes Feed -->
      <div class="notes-list" id="notesList">
        <!-- Rendered by JS -->
      </div>
    </div>

  </div>

  <!-- CHECKIN & STREAK FOOTER -->
  <div class="checkin-banner">
    <div class="streak-badge">
      <span>🔥</span>
      <span id="txtStreak">Streak: 1 Hari Bersama</span>
    </div>
    <div style="font-size: 0.8rem; color: var(--text-muted);" id="txtCheckinStatus">
      Belum check-in hari ini
    </div>
  </div>

  <script>
    const socket = io();
    let selectedNoteColor = '#fef08a';

    // Elements
    const usernameInput = document.getElementById('usernameInput');
    const catAvatar = document.getElementById('catAvatar');
    const bubbleAction = document.getElementById('bubbleAction');
    const petName = document.getElementById('petName');
    const petLevel = document.getElementById('petLevel');
    const petStatus = document.getElementById('petStatus');
    const barHunger = document.getElementById('barHunger');
    const barHappy = document.getElementById('barHappy');
    const barEnergy = document.getElementById('barEnergy');
    const txtHunger = document.getElementById('txtHunger');
    const txtHappy = document.getElementById('txtHappy');
    const txtEnergy = document.getElementById('txtEnergy');
    const notesList = document.getElementById('notesList');
    const noteInput = document.getElementById('noteInput');
    const btnSleep = document.getElementById('btnSleep');
    const txtStreak = document.getElementById('txtStreak');
    const txtCheckinStatus = document.getElementById('txtCheckinStatus');

    // Decor Elements
    const decorFairy = document.getElementById('decorFairy');
    const decorWindow = document.getElementById('decorWindow');

    function selectColor(color, el) {
      selectedNoteColor = color;
      document.querySelectorAll('.dot-color').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
    }

    function showBubble(text) {
      bubbleAction.innerText = text;
      bubbleAction.classList.add('show');
      setTimeout(() => bubbleAction.classList.remove('show'), 2500);
    }

    function spawnHeart(e) {
      const heart = document.createElement('div');
      heart.className = 'heart-float';
      heart.innerText = ['💖', '✨', '🐾', '🌸'][Math.floor(Math.random() * 4)];
      
      const rect = catAvatar.getBoundingClientRect();
      const x = (e ? e.clientX : rect.left + rect.width / 2) - 10;
      const y = (e ? e.clientY : rect.top) - 10;
      
      heart.style.left = `${x}px`;
      heart.style.top = `${y}px`;
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1200);
    }

    function renderPet(pet) {
      petName.innerText = pet.name || 'Mimi';
      petLevel.innerText = `Lvl ${pet.love_level || 1}`;
      
      barHunger.style.width = `${pet.hunger}%`;
      txtHunger.innerText = `${pet.hunger}%`;

      barHappy.style.width = `${pet.happiness}%`;
      txtHappy.innerText = `${pet.happiness}%`;

      barEnergy.style.width = `${pet.energy}%`;
      txtEnergy.innerText = `${pet.energy}%`;

      if (pet.sleeping) {
        catAvatar.innerText = '😴';
        catAvatar.classList.add('sleeping');
        petStatus.innerText = 'Status: Tidur Nyenyak zzz';
        btnSleep.innerHTML = '<span>☀️</span> Bangun';
      } else {
        catAvatar.innerText = pet.status === 'eating' ? '😺' : (pet.status === 'purring' ? '😻' : '🐱');
        catAvatar.classList.remove('sleeping');
        petStatus.innerText = `Status: ${pet.status || 'Santai'}`;
        btnSleep.innerHTML = '<span>💤</span> Tidur';
      }
    }

    function renderNotes(notes) {
      notesList.innerHTML = '';
      if (!notes || notes.length === 0) {
        notesList.innerHTML = '<div style="font-size:0.8rem; color:var(--text-muted); text-align:center; padding:20px;">Belum ada catatan hari ini 🍃</div>';
        return;
      }
      notes.forEach(n => {
        const div = document.createElement('div');
        div.className = 'sticky-card';
        div.style.background = n.color || '#fef08a';
        div.innerHTML = `
          <div class="sticky-author">${escapeHtml(n.author)}</div>
          <div class="sticky-content">${escapeHtml(n.content)}</div>
          <div class="sticky-time">${n.created_at ? n.created_at.slice(11, 16) : ''}</div>
        `;
        notesList.appendChild(div);
      });
    }

    function renderDecor(decor) {
      if (decor.fairy_lights) decorFairy.style.display = 'flex';
      if (decor.window_rain) decorWindow.style.display = 'block';
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // API Calls
    async function loadState() {
      try {
        const res = await fetch('/api/state');
        const data = await res.json();
        renderPet(data.pet);
        renderNotes(data.notes);
        renderDecor(data.decor);
        
        txtStreak.innerText = `Streak: ${data.total_days} Hari Bersama`;
        const myName = usernameInput.value.trim();
        if (data.checked_today && data.checked_today.includes(myName)) {
          txtCheckinStatus.innerText = '✅ Sudah check-in hari ini';
        } else {
          txtCheckinStatus.innerText = '⏳ Belum check-in hari ini';
        }
      } catch (err) {
        console.error("Gagal load state:", err);
      }
    }

    async function handlePetAction(action, e) {
      const user = usernameInput.value.trim() || 'Kamu';
      spawnHeart(e);
      try {
        const res = await fetch('/api/pet/action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, user })
        });
        const data = await res.json();
        if (data.success) {
          renderPet(data.pet);
          showBubble(data.message);
        } else {
          showBubble(data.message || 'Gagal');
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function handleSendNote() {
      const author = usernameInput.value.trim() || 'Anon';
      const content = noteInput.value.trim();
      if (!content) return;

      try {
        const res = await fetch('/api/notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ author, content, color: selectedNoteColor })
        });
        const data = await res.json();
        if (data.success) {
          noteInput.value = '';
          renderNotes(data.notes);
          showBubble("Catatan tertempel! 📝");
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function handleCheckin() {
      const user = usernameInput.value.trim() || 'Kamu';
      try {
        const res = await fetch('/api/checkin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user })
        });
        const data = await res.json();
        showBubble(data.message);
        loadState();
      } catch (err) {
        console.error(err);
      }
    }

    // Socket.io real-time listeners
    socket.on('pet_updated', (payload) => {
      renderPet(payload.pet);
      showBubble(payload.message);
      spawnHeart();
    });

    socket.on('notes_updated', (notes) => {
      renderNotes(notes);
    });

    socket.on('checkin_updated', (payload) => {
      showBubble(`Check-in dari ${payload.user}! 🎉`);
      loadState();
    });

    // Initial load
    loadState();
  </script>
</body>
</html>
